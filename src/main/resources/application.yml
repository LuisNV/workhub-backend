spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: workhub-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/workhub}
    username: ${DB_USERNAME:workhub}
    password: ${DB_PASSWORD:workhub_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  config:
    import: optional:file:.env[.properties]
  # Gmail SMTP: MAIL_USERNAME là địa chỉ Gmail, MAIL_PASSWORD là App Password 16 ký tự
  # (Google Account > Security > 2-Step Verification > App passwords), KHÔNG phải mật khẩu Gmail.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8081}
  error:
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    # /actuator/health công khai, không để nó mở kết nối SMTP tới Gmail mỗi lần bị gọi.
    mail:
      enabled: false
app:
  cloudinary:
    enabled: ${CLOUDINARY_ENABLED:true}
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*]}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    from-name: ${MAIL_FROM_NAME:WorkHub}
  auth:
    # Số thiết bị đăng nhập cùng lúc. Đăng nhập thiết bị mới khi đã đủ thì thiết bị lâu không dùng nhất bị đăng xuất.
    max-sessions-per-user: 5
  registration:
    session-ttl-minutes: 60
    otp-ttl-minutes: 10
    otp-resend-cooldown-seconds: 45
    otp-max-attempts: 5
    otp-max-sends: 5
    otp-max-sends-per-email-per-hour: 10
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: workhub-backend
    access-token-minutes: 15

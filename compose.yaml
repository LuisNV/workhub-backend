services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: workhub
      POSTGRES_USER: workhub
      POSTGRES_PASSWORD: workhub_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - workhub-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workhub -d workhub"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  workhub-data:
